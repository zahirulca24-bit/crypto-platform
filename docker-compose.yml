services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: crypto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crypto_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: crypto_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: crypto_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-crypto_platform}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_secret_key_change_in_production_987654321}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      DEMO_EXCHANGE: ${DEMO_EXCHANGE:-binance}
      DEMO_API_KEY: ${DEMO_API_KEY:-}
      DEMO_API_SECRET: ${DEMO_API_SECRET:-}
      DEMO_API_PASSWORD: ${DEMO_API_PASSWORD:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL:-gemini-2.5-flash}
      GOOGLE_AI_TEMPERATURE: ${GOOGLE_AI_TEMPERATURE:-0.2}
      GOOGLE_AI_MAX_OUTPUT_TOKENS: ${GOOGLE_AI_MAX_OUTPUT_TOKENS:-2048}
      GOOGLE_AI_TIMEOUT_SECONDS: ${GOOGLE_AI_TIMEOUT_SECONDS:-30}
      AI_RESEARCH_MAX_PROPOSALS_PER_RUN: ${AI_RESEARCH_MAX_PROPOSALS_PER_RUN:-5}
      AI_BLUEPRINT_MIN_READINESS_SCORE: ${AI_BLUEPRINT_MIN_READINESS_SCORE:-0.65}
      AI_BLUEPRINT_MAX_PARAMETER_COMBINATIONS: ${AI_BLUEPRINT_MAX_PARAMETER_COMBINATIONS:-500}
      AI_BLUEPRINT_MAX_CONDITIONS: ${AI_BLUEPRINT_MAX_CONDITIONS:-20}
      AI_EVOLUTION_MAX_VARIANTS_PER_GENERATION: ${AI_EVOLUTION_MAX_VARIANTS_PER_GENERATION:-10}
      AI_EVOLUTION_MAX_CHANGED_FIELDS: ${AI_EVOLUTION_MAX_CHANGED_FIELDS:-3}
      AI_EVOLUTION_MAX_GENERATIONS_PER_REQUEST: ${AI_EVOLUTION_MAX_GENERATIONS_PER_REQUEST:-1}
      AI_EVOLUTION_MIN_CHALLENGER_IMPROVEMENT: ${AI_EVOLUTION_MIN_CHALLENGER_IMPROVEMENT:-0.03}
      AI_MATCH_MIN_REGIME_TRADES: ${AI_MATCH_MIN_REGIME_TRADES:-10}
      AI_PORTFOLIO_MAX_COMPONENTS: ${AI_PORTFOLIO_MAX_COMPONENTS:-5}
      AI_PORTFOLIO_MAX_COMPONENT_WEIGHT: ${AI_PORTFOLIO_MAX_COMPONENT_WEIGHT:-0.40}
      AI_PORTFOLIO_MAX_PAIRWISE_CORRELATION: ${AI_PORTFOLIO_MAX_PAIRWISE_CORRELATION:-0.85}
      AI_PORTFOLIO_MIN_READINESS_SCORE: ${AI_PORTFOLIO_MIN_READINESS_SCORE:-0.60}
      AI_SHADOW_MIN_TRADES: ${AI_SHADOW_MIN_TRADES:-10}
      AI_SHADOW_MIN_EXPECTANCY: ${AI_SHADOW_MIN_EXPECTANCY:-0}
      AI_SHADOW_MAX_DRAWDOWN: ${AI_SHADOW_MAX_DRAWDOWN:-1000}
      AI_SHADOW_MAX_DRIFT: ${AI_SHADOW_MAX_DRIFT:-0.50}
      AI_SHADOW_MIN_DATA_QUALITY: ${AI_SHADOW_MIN_DATA_QUALITY:-0.60}
      AI_SHADOW_MIN_READINESS_SCORE: ${AI_SHADOW_MIN_READINESS_SCORE:-0.60}
      AI_SHADOW_MAX_CANDLES_PER_PROCESS: ${AI_SHADOW_MAX_CANDLES_PER_PROCESS:-250}
      AI_HANDOFF_REQUIRE_SHADOW: ${AI_HANDOFF_REQUIRE_SHADOW:-false}
      AI_BACKTEST_FEE_BPS: ${AI_BACKTEST_FEE_BPS:-10}
      AI_BACKTEST_SLIPPAGE_BPS: ${AI_BACKTEST_SLIPPAGE_BPS:-5}
      AI_BACKTEST_INTRABAR_CONFLICT_POLICY: ${AI_BACKTEST_INTRABAR_CONFLICT_POLICY:-stop_first}
      AI_BACKTEST_FIXED_NOTIONAL: ${AI_BACKTEST_FIXED_NOTIONAL:-1000}
      AI_VALIDATION_MIN_TRADES: ${AI_VALIDATION_MIN_TRADES:-10}
      AI_VALIDATION_MIN_EXPECTANCY: ${AI_VALIDATION_MIN_EXPECTANCY:-0}
      AI_VALIDATION_MIN_PROFIT_FACTOR: ${AI_VALIDATION_MIN_PROFIT_FACTOR:-1.05}
      AI_VALIDATION_MAX_DRAWDOWN: ${AI_VALIDATION_MAX_DRAWDOWN:-20}
      AI_VALIDATION_MIN_STABILITY: ${AI_VALIDATION_MIN_STABILITY:-0.50}
      AI_VALIDATION_MIN_DATA_QUALITY: ${AI_VALIDATION_MIN_DATA_QUALITY:-0.60}
      AI_VALIDATION_MAX_OVERFIT_RISK: ${AI_VALIDATION_MAX_OVERFIT_RISK:-0.65}
      AI_VALIDATION_MAX_EXECUTION_COST_DRAG: ${AI_VALIDATION_MAX_EXECUTION_COST_DRAG:-0.60}
      AI_REVIEW_MIN_EVIDENCE_SCORE: ${AI_REVIEW_MIN_EVIDENCE_SCORE:-0.35}
      AI_REVIEW_MIN_TESTABILITY_SCORE: ${AI_REVIEW_MIN_TESTABILITY_SCORE:-0.45}
      AI_REVIEW_MIN_DATA_QUALITY_SCORE: ${AI_REVIEW_MIN_DATA_QUALITY_SCORE:-0.35}
      AI_REVIEW_MIN_OVERALL_SCORE: ${AI_REVIEW_MIN_OVERALL_SCORE:-0.50}
      AI_MONITOR_AUTO_QUEUE_RESEARCH: ${AI_MONITOR_AUTO_QUEUE_RESEARCH:-false}
      AI_DEMO_MANIFEST_MIN_COMPATIBILITY_SCORE: ${AI_DEMO_MANIFEST_MIN_COMPATIBILITY_SCORE:-0.80}
      AI_DEMO_RELEASE_MIN_READINESS_SCORE: ${AI_DEMO_RELEASE_MIN_READINESS_SCORE:-0.75}
      AI_DEMO_RELEASE_BLOCK_SEVERE_TRIGGERS: ${AI_DEMO_RELEASE_BLOCK_SEVERE_TRIGGERS:-true}
      AI_MONITOR_DEFAULT_COOLDOWN_SECONDS: ${AI_MONITOR_DEFAULT_COOLDOWN_SECONDS:-21600}
      AI_MONITOR_MIN_SAMPLE_SIZE: ${AI_MONITOR_MIN_SAMPLE_SIZE:-20}
      AI_MONITOR_MAX_POLICIES_PER_CYCLE: ${AI_MONITOR_MAX_POLICIES_PER_CYCLE:-50}
      AI_MONITOR_MAX_TRIGGERS_PER_CYCLE: ${AI_MONITOR_MAX_TRIGGERS_PER_CYCLE:-20}
      AI_MONITOR_MAX_JOBS_PER_CYCLE: ${AI_MONITOR_MAX_JOBS_PER_CYCLE:-10}
      AI_MONITOR_POLL_SECONDS: ${AI_MONITOR_POLL_SECONDS:-60}
      AI_MONITOR_MAX_JOB_RETRIES: ${AI_MONITOR_MAX_JOB_RETRIES:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  celery-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: crypto_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "celery_app.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-crypto_platform}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: crypto_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy

  trading-worker:
    build:
      context: ./services/trading-worker
      dockerfile: Dockerfile
    container_name: crypto_trading_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  supervisor:
    build:
      context: ./services/supervisor
      dockerfile: Dockerfile
    container_name: crypto_supervisor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  research-worker:
    build:
      context: ./services/research-worker
      dockerfile: Dockerfile
    container_name: crypto_research_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  research-monitor-worker:
    build:
      context: .
      dockerfile: services/research-monitor-worker/Dockerfile
    container_name: crypto_research_monitor_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-crypto_platform}
      REDIS_URL: redis://redis:6379/0
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GOOGLE_AI_MODEL: ${GOOGLE_AI_MODEL:-gemini-2.5-flash}
      GOOGLE_AI_TEMPERATURE: ${GOOGLE_AI_TEMPERATURE:-0.2}
      GOOGLE_AI_MAX_OUTPUT_TOKENS: ${GOOGLE_AI_MAX_OUTPUT_TOKENS:-2048}
      GOOGLE_AI_TIMEOUT_SECONDS: ${GOOGLE_AI_TIMEOUT_SECONDS:-30}
      AI_MONITOR_AUTO_QUEUE_RESEARCH: ${AI_MONITOR_AUTO_QUEUE_RESEARCH:-false}
      AI_DEMO_MANIFEST_MIN_COMPATIBILITY_SCORE: ${AI_DEMO_MANIFEST_MIN_COMPATIBILITY_SCORE:-0.80}
      AI_DEMO_RELEASE_MIN_READINESS_SCORE: ${AI_DEMO_RELEASE_MIN_READINESS_SCORE:-0.75}
      AI_DEMO_RELEASE_BLOCK_SEVERE_TRIGGERS: ${AI_DEMO_RELEASE_BLOCK_SEVERE_TRIGGERS:-true}
      AI_MONITOR_DEFAULT_COOLDOWN_SECONDS: ${AI_MONITOR_DEFAULT_COOLDOWN_SECONDS:-21600}
      AI_MONITOR_MIN_SAMPLE_SIZE: ${AI_MONITOR_MIN_SAMPLE_SIZE:-20}
      AI_MONITOR_MAX_POLICIES_PER_CYCLE: ${AI_MONITOR_MAX_POLICIES_PER_CYCLE:-50}
      AI_MONITOR_MAX_TRIGGERS_PER_CYCLE: ${AI_MONITOR_MAX_TRIGGERS_PER_CYCLE:-20}
      AI_MONITOR_MAX_JOBS_PER_CYCLE: ${AI_MONITOR_MAX_JOBS_PER_CYCLE:-10}
      AI_MONITOR_POLL_SECONDS: ${AI_MONITOR_POLL_SECONDS:-60}
      AI_MONITOR_MAX_JOB_RETRIES: ${AI_MONITOR_MAX_JOB_RETRIES:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
